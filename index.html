<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#101010">

<meta name="description"
content="Meu Treino - Diário de treino e progressão">

<link rel="manifest" href="manifest.json">

<title>Meu Treino</title>

<style>

:root {

    --bg: #101010;
    --card: #1d1d1d;
    --card2: #262626;
    --border: #353535;
    --primary: #ff3333;
    --text: #ffffff;
    --secondary: #a8a8a8;
    --success: #35c759;
    --warning: #ffb000;

}

* {

    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;

}

html,
body {

    margin: 0;
    min-height: 100%;
    background: var(--bg);

}

body {

    padding: 15px;
    padding-bottom: 90px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);

}

button,
input,
select {

    font-family: inherit;

}

button {

    cursor: pointer;

}

/* =========================
   SPLASH SCREEN
========================= */

#splashScreen {

    position: fixed;
    inset: 0;

    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #101010;

    overflow: hidden;

    transition:
        opacity .6s ease,
        visibility .6s ease;

}

#splashScreen.hidden {

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

}

#splashScreen img {

    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

}

.splash-overlay {

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.2),
            rgba(0,0,0,.85)
        );

}

.splash-content {

    position: relative;
    z-index: 2;

    text-align: center;

}

.splash-title {

    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;

    text-shadow:
        0 0 15px rgba(255,51,51,.8);

}

.splash-subtitle {

    margin-top: 8px;
    color: #ddd;

}

.loading-dots {

    display: flex;
    justify-content: center;
    gap: 8px;

    margin-top: 25px;

}

.loading-dots span {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: var(--primary);

    animation:
        pulse 1.2s infinite ease-in-out;

}

.loading-dots span:nth-child(2) {

    animation-delay: .15s;

}

.loading-dots span:nth-child(3) {

    animation-delay: .3s;

}

@keyframes pulse {

    0%,
    80%,
    100% {

        opacity: .3;
        transform: scale(.8);

    }

    40% {

        opacity: 1;
        transform: scale(1.15);

    }

}

/* =========================
   HEADER
========================= */

header {

    text-align: center;
    margin-bottom: 20px;

}

h1 {

    margin: 5px 0;

    color: var(--primary);

    font-size: 28px;

}

.subtitle {

    color: var(--secondary);
    font-size: 13px;

}

.top-controls {

    display: flex;
    gap: 10px;
    margin-bottom: 15px;

}

select {

    flex: 1;

    padding: 14px;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    font-size: 16px;

    outline: none;

}

.menu-button {

    width: 50px;

    border: 1px solid var(--border);

    border-radius: 10px;

    background: var(--card);

    color: white;

    font-size: 22px;

}

/* =========================
   RESUMO
========================= */

.summary {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 15px;

}

.summary-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;

}

.day-title {

    font-size: 21px;
    font-weight: bold;

}

.progress-label {

    color: var(--secondary);
    font-size: 13px;

}

.progress-bar {

    height: 9px;

    background: #333;

    border-radius: 10px;

    overflow: hidden;

}

.progress-fill {

    height: 100%;

    width: 0%;

    background: var(--success);

    transition: width .3s ease;

}

/* =========================
   EXERCÍCIOS
========================= */

.exercise-card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 15px;

    margin-bottom: 15px;

    padding: 15px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.25);

    transition:
        transform .2s,
        opacity .2s;

}

.exercise-card.dragging {

    opacity: .45;

    transform: scale(.97);

    border: 2px dashed var(--primary);

}

.exercise-card.completed {

    border-color: var(--success);

}

.exercise-header {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 14px;

}

.drag-handle {

    font-size: 23px;

    color: var(--secondary);

    cursor: grab;

    touch-action: none;

    padding: 8px 4px;

}

.drag-handle:active {

    cursor: grabbing;

}

.exercise-info {

    flex: 1;
    min-width: 0;

}

.exercise-name,
.exercise-description {

    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: var(--text);

}

.exercise-name {

    font-size: 18px;
    font-weight: bold;

}

.exercise-description {

    color: var(--secondary);

    font-size: 13px;

    margin-top: 5px;

}

.delete-button {

    border: none;

    background: transparent;

    color: #ff5555;

    font-size: 19px;

    padding: 5px;

}

/* =========================
   SÉRIES
========================= */

.sets-header,
.set-row {

    display: grid;

    grid-template-columns:
        40px
        1fr
        1fr
        42px;

    gap: 8px;

    align-items: center;

}

.sets-header {

    color: var(--secondary);

    font-size: 12px;

    text-align: center;

    margin-bottom: 6px;

}

.set-row {

    margin-bottom: 8px;

}

.set-number {

    text-align: center;

    color: var(--secondary);

    font-weight: bold;

}

.set-input {

    width: 100%;

    min-width: 0;

    padding: 10px 5px;

    text-align: center;

    border-radius: 8px;

    border: 1px solid var(--border);

    background: var(--card2);

    color: white;

    font-size: 16px;

}

.set-checkbox {

    width: 25px;
    height: 25px;

    accent-color: var(--success);

}

/* =========================
   BOTÕES
========================= */

.exercise-actions {

    display: flex;

    gap: 8px;

    margin-top: 12px;

}

.action-button {

    flex: 1;

    padding: 10px;

    border-radius: 8px;

    border: 1px solid var(--border);

    background: var(--card2);

    color: var(--text);

    font-size: 13px;

}

.action-button.primary {

    border-color: var(--primary);

    color: var(--primary);

}

.add-exercise {

    width: 100%;

    padding: 15px;

    border-radius: 12px;

    border: 2px dashed var(--primary);

    background: transparent;

    color: var(--primary);

    font-size: 16px;

    font-weight: bold;

}

/* =========================
   SUGESTÃO
========================= */

.suggestion {

    margin-top: 12px;

    padding: 12px;

    border-radius: 10px;

    background:
        rgba(255,176,0,.1);

    border:
        1px solid rgba(255,176,0,.35);

    color: var(--warning);

    font-size: 13px;

}

/* =========================
   BARRA INFERIOR
========================= */

.bottom-bar {

    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 10px 15px;

    background: #181818;

    border-top: 1px solid var(--border);

}

.bottom-bar button {

    padding: 9px 12px;

    border-radius: 8px;

    border: 1px solid var(--border);

    background: transparent;

    color: var(--secondary);

}

/* =========================
   MODAIS
========================= */

.modal,
.timer {

    position: fixed;

    inset: 0;

    z-index: 90;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.85);

}

.modal.active,
.timer.active {

    display: flex;

}

.modal-box,
.timer-box {

    width: 90%;

    max-width: 400px;

    background: var(--card);

    border-radius: 15px;

    padding: 20px;

}

.modal-box h2 {

    margin-top: 0;

}

.modal-button {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border-radius: 9px;

    border: 1px solid var(--border);

    background: var(--card2);

    color: white;

}

/* =========================
   POPUP DE INSTALAÇÃO
========================= */

.install-popup {

    position: fixed;

    left: 15px;
    right: 15px;
    bottom: 20px;

    z-index: 1000;

    max-width: 500px;

    margin: auto;

    padding: 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #242424,
            #171717
        );

    border: 1px solid #444;

    box-shadow:
        0 10px 40px rgba(0,0,0,.7);

    transform:
        translateY(150%);

    opacity: 0;

    transition:
        transform .45s ease,
        opacity .45s ease;

}

.install-popup.show {

    transform:
        translateY(0);

    opacity: 1;

}

.install-header {

    display: flex;

    align-items: center;

    gap: 12px;

}

.install-icon {

    width: 52px;
    height: 52px;

    border-radius: 13px;

    object-fit: cover;

}

.install-text {

    flex: 1;

}

.install-title {

    font-size: 18px;

    font-weight: bold;

}

.install-description {

    color: var(--secondary);

    font-size: 13px;

    margin-top: 4px;

}

.install-close {

    border: none;

    background: transparent;

    color: var(--secondary);

    font-size: 22px;

}

.install-buttons {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}

.install-buttons button {

    flex: 1;

    padding: 12px;

    border-radius: 9px;

    font-weight: bold;

}

.install-now {

    background: var(--primary);

    border: none;

    color: white;

}

.install-later {

    background: transparent;

    border: 1px solid var(--border);

    color: var(--secondary);

}

/* =========================
   TIMER
========================= */

.timer-box {

    text-align: center;

}

.timer-title {

    color: var(--secondary);

}

.timer-value {

    font-size: 58px;

    font-weight: bold;

    color: var(--primary);

    margin: 15px 0;

}

.timer-buttons {

    display: flex;

    gap: 10px;

}

.timer-buttons button {

    flex: 1;

    padding: 12px;

    border-radius: 9px;

    border: none;

    background: var(--primary);

    color: white;

    font-weight: bold;

}

/* =========================
   GRÁFICO
========================= */

.chart-container {

    margin-top: 15px;

    background: var(--card2);

    border-radius: 10px;

    padding: 10px;

}

canvas {

    width: 100%;

    height: 220px;

    display: block;

}

.history-info {

    margin-top: 10px;

    color: var(--secondary);

    font-size: 12px;

}

@media (min-width: 700px) {

    body {

        max-width: 700px;

        margin: auto;

    }

    .bottom-bar {

        max-width: 700px;

        margin: auto;

    }

}

</style>

</head>

<script>

/* =========================
   INSTALAÇÃO PWA
========================= */

let deferredPrompt = null;

const installPopup =
    document.getElementById(
        "installPopup"
    );

const installButton =
    document.getElementById(
        "installApp"
    );

const installLater =
    document.getElementById(
        "installLater"
    );

const closeInstall =
    document.getElementById(
        "closeInstall"
    );

function isStandalone() {

    return (

        window.matchMedia(
            "(display-mode: standalone)"
        ).matches

        ||

        window.navigator.standalone === true

    );

}

/*

O navegador dispara este evento
quando o PWA pode ser instalado.

*/

window.addEventListener(

    "beforeinstallprompt",

    event => {

        event.preventDefault();

        deferredPrompt =
            event;

        const lastClosed =
            localStorage.getItem(
                "installPopupClosed"
            );

        const now =
            Date.now();

        const sevenDays =
            7 *
            24 *
            60 *
            60 *
            1000;

        const shouldShow =

            !lastClosed

            ||

            now -
            Number(
                lastClosed
            )
            >
            sevenDays;

        if (

            !isStandalone()

            &&

            shouldShow

        ) {

            setTimeout(

                () => {

                    installPopup
                        .classList
                        .add(
                            "show"
                        );

                },

                2500

            );

        }

    }

);

/*

Botão Instalar

*/

installButton.addEventListener(

    "click",

    async () => {

        if (

            !deferredPrompt

        ) {

            alert(

                "A instalação ainda não está disponível neste navegador. Use o menu do navegador e escolha 'Adicionar à tela inicial'."

            );

            return;

        }

        deferredPrompt.prompt();

        const choice =
            await deferredPrompt
                .userChoice;

        if (

            choice.outcome ===
            "accepted"

        ) {

            console.log(
                "Aplicativo instalado"
            );

        }

        deferredPrompt =
            null;

        installPopup
            .classList
            .remove(
                "show"
            );

    }

);

/*

Agora não

*/

installLater.addEventListener(

    "click",

    () => {

        localStorage.setItem(

            "installPopupClosed",

            Date.now()

        );

        installPopup
            .classList
            .remove(
                "show"
            );

    }

);

/*

Fechar popup

*/

closeInstall.addEventListener(

    "click",

    () => {

        localStorage.setItem(

            "installPopupClosed",

            Date.now()

        );

        installPopup
            .classList
            .remove(
                "show"
            );

    }

);

/*

Quando o app for instalado,
o popup desaparece.

*/

window.addEventListener(

    "appinstalled",

    () => {

        installPopup
            .classList
            .remove(
                "show"
            );

        deferredPrompt =
            null;

    }

);

/* =========================
   BANCO DE DADOS
========================= */

const HISTORY_KEY =

function createExercise(

    name,
    description,
    numberOfSets,
    weight,
    reps

) {

    return {

        id:

            crypto.randomUUID(),

        name,

        description,

        targetReps:

            reps,

        sets:

            Array.from(

                {

                    length:
                        numberOfSets

                },

                () => ({

                    weight,

                    reps,

                    done:
                        false

                })

            )

    };

}

let db =

    JSON.parse(

        localStorage.getItem(

        )

    )

    ||

    structuredClone(
        dbPadrao
    );

let history =

    JSON.parse(

        localStorage.getItem(
            HISTORY_KEY
        )

    )

    ||

    [];

/* =========================
   ELEMENTOS
========================= */

const daySelect =
    document.getElementById(
        "daySelect"
    );

const exerciseList =
    document.getElementById(
        "exerciseList"
    );

const dayTitle =
    document.getElementById(
        "dayTitle"
    );

const progressLabel =
    document.getElementById(
        "progressLabel"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const totalInfo =
    document.getElementById(
        "totalInfo"
    );

/* =========================
   SALVAMENTO
========================= */

function save() {

    localStorage.setItem(

        DB_KEY,

        JSON.stringify(
            db
        )

    );

    localStorage.setItem(

        HISTORY_KEY,

        JSON.stringify(
            history
        )

    );

}

/* =========================
   SUGESTÃO DE CARGA
========================= */

function getSuggestion(
    exercise
) {

    if (

        !exercise.sets.length

    ) {

        return null;

    }

    const lastSet =

        exercise.sets[
            exercise.sets.length - 1
        ];

    const target =

        exercise.targetReps

        ||

        lastSet.reps;

    const allCompleted =

        exercise.sets.every(

            set =>
                set.done

        );

    const reachedTarget =

        exercise.sets.every(

            set =>
                set.reps >= target

        );

    if (

        allCompleted

        &&

        reachedTarget

    ) {

        const increase =

            lastSet.weight >= 50

                ?

            2.5

                :

            1.25;

        return {

            weight:

                lastSet.weight +
                increase,

            text:

                "Você atingiu a meta em todas as séries. Aumente progressivamente a carga."

        };

    }

    return {

        weight:

            lastSet.weight,

        text:

            "Mantenha a carga e tente melhorar suas repetições."

    };

}

/* =========================
   HISTÓRICO
========================= */

function registerHistory(
    exercise
) {

    const completedSets =

        exercise.sets.filter(

            set =>
                set.done

        );

    if (

        !completedSets.length

    ) {

        return;

    }

    const date =

        new Date()

            .toISOString()

            .split(
                "T"
            )[0];

    const maxWeight =

        Math.max(

            ...completedSets.map(

                set =>

                    Number(
                        set.weight
                    )

                    ||

                    0

            )

        );

    const totalVolume =

        completedSets.reduce(

            (

                total,

                set

            ) =>

                total +

                (

                    Number(
                        set.weight
                    )

                    ||

                    0

                )

                *

                (

                    Number(
                        set.reps
                    )

                    ||

                    0

                ),

            0

        );

    const existing =

        history.find(

            item =>

                item.exerciseId ===
                exercise.id

                &&

                item.date ===
                date

        );

    if (

        existing

    ) {

        existing.maxWeight =
            maxWeight;

        existing.totalVolume =
            totalVolume;

    }

    else {

        history.push({

            exerciseId:
                exercise.id,

            exerciseName:
                exercise.name,

            date,

            maxWeight,

            totalVolume

        });

    }

    save();

}

/* =========================
   GRÁFICO
========================= */

function showChart(
    exercise
) {

    const records =

        history.filter(

            item =>

                item.exerciseId ===
                exercise.id

        );

    if (

        records.length < 1

    ) {

        alert(

            "Ainda não há histórico suficiente para este exercício."

        );

        return;

    }

    const existing =

        document.querySelector(

            `.chart-container[data-id="${exercise.id}"]`

        );

    if (

        existing

    ) {

        existing.remove();

        return;

    }

    const wrapper =

        document.createElement(
            "div"
        );

    wrapper.className =
        "chart-container";

    wrapper.dataset.id =
        exercise.id;

    const canvas =

        document.createElement(
            "canvas"
        );

    canvas.width =
        700;

    canvas.height =
        300;

    wrapper.appendChild(
        canvas
    );

    const info =

        document.createElement(
            "div"
        );

    info.className =
        "history-info";

    info.textContent =

        `${records.length} registro(s) de progressão`;

    wrapper.appendChild(
        info
    );

    const card =

        document.querySelector(

            `[data-id="${exercise.id}"]`

        );

    card.appendChild(
        wrapper
    );

    drawChart(
        canvas,
        records
    );

}

function drawChart(
    canvas,
    records
) {

    const ctx =
        canvas.getContext(
            "2d"
        );

    const width =
        canvas.width;

    const height =
        canvas.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    const values =

        records.map(

            item =>
                item.maxWeight

        );

    const max =

        Math.max(
            ...values,
            1
        );

    const min =

        Math.min(
            ...values,
            0
        );

    const padding =
        45;

    ctx.strokeStyle =
        "#555";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        padding,
        20
    );

    ctx.lineTo(
        padding,
        height - padding
    );

    ctx.lineTo(
        width - 20,
        height - padding
    );

    ctx.stroke();

    ctx.strokeStyle =
        "#ff3333";

    ctx.lineWidth =
        5;

    ctx.beginPath();

    values.forEach(

        (

            value,

            index

        ) => {

            const x =

                padding +

                (

                    index /

                    Math.max(

                        values.length - 1,

                        1

                    )

                )

                *

                (

                    width -
                    padding -
                    30

                );

            const y =

                height -
                padding -

                (

                    (

                        value -
                        min

                    )

                    /

                    Math.max(

                        max -
                        min,

                        1

                    )

                )

                *

                (

                    height -
                    padding -
                    40

                );

            if (

                index === 0

            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }

    );

    ctx.stroke();

    values.forEach(

        (

            value,

            index

        ) => {

            const x =

                padding +

                (

                    index /

                    Math.max(

                        values.length - 1,

                        1

                    )

                )

                *

                (

                    width -
                    padding -
                    30

                );

            const y =

                height -
                padding -

                (

                    (

                        value -
                        min

                    )

                    /

                    Math.max(

                        max -
                        min,

                        1

                    )

                )

                *

                (

                    height -
                    padding -
                    40

                );

            ctx.fillStyle =
                "#ff3333";

            ctx.beginPath();

            ctx.arc(

                x,
                y,
                7,
                0,
                Math.PI * 2

            );

            ctx.fill();

            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "18px Arial";

            ctx.fillText(

                value + " kg",

                x - 20,

                y - 15

            );

        }

    );

}

/* =========================
   RENDER
========================= */

function render() {

    const day =
        daySelect.value;

    const exercises =
        db[day];

    exerciseList.innerHTML =
        "";

    dayTitle.textContent =
        day;

    let totalSets =
        0;

    let completedSets =
        0;

    exercises.forEach(

        exercise => {

            totalSets +=
                exercise.sets.length;

            completedSets +=

                exercise.sets.filter(

                    set =>
                        set.done

                ).length;

        }

    );

    const percentage =

        totalSets === 0

            ?

        0

            :

        Math.round(

            completedSets /
            totalSets *
            100

        );

    progressLabel.textContent =

        `${completedSets}/${totalSets} séries`;

    progressFill.style.width =

        `${percentage}%`;

    totalInfo.textContent =

        `${percentage}% concluído`;

    exercises.forEach(

        (

            exercise,

            exerciseIndex

        ) => {

            const card =

                document.createElement(
                    "div"
                );

            card.className =
                "exercise-card";

            card.dataset.id =
                exercise.id;

            card.dataset.index =
                exerciseIndex;

            const allDone =

                exercise.sets.length > 0

                &&

                exercise.sets.every(

                    set =>
                        set.done

                );

            if (

                allDone

            ) {

                card.classList.add(
                    "completed"
                );

            }

            const suggestion =

                getSuggestion(
                    exercise
                );

            card.innerHTML = `

                <div class="exercise-header">

                    <span class="drag-handle">

                        ☰

                    </span>

                    <div class="exercise-info">

                        <input

                            class="exercise-name"

                            value="${escapeHTML(

                                exercise.name

                            )}">

                        <input

                            class="exercise-description"

                            value="${escapeHTML(

                                exercise.description ||
                                ""

                            )}">

                    </div>

                    <button

                        class="delete-button">

                        🗑

                    </button>

                </div>

                <div class="sets-header">

                    <span>Série</span>

                    <span>Carga kg</span>

                    <span>Reps</span>

                    <span>✓</span>

                </div>

                <div class="sets-container">

                </div>

                ${

                    suggestion

                        ?

                    `

                    <div class="suggestion">

                        💡 Próximo treino:

                        <strong>

                            ${suggestion.weight} kg

                        </strong>

                        <br>

                        ${suggestion.text}

                    </div>

                    `

                        :

                    ""

                }

                <div class="exercise-actions">

                    <button

                        class="action-button primary add-set">

                        + Série

                    </button>

                    <button

                        class="action-button chart-button">

                        📈 Progressão

                    </button>

                    <button

                        class="action-button rest-button">

                        ⏱ Descanso

                    </button>

                </div>

            `;

            const nameInput =

                card.querySelector(

                    ".exercise-name"

                );

            const descriptionInput =

                card.querySelector(

                    ".exercise-description"

                );

            nameInput.addEventListener(

                "change",

                () => {

                    exercise.name =
                        nameInput.value;

                    save();

                }

            );

            descriptionInput.addEventListener(

                "change",

                () => {

                    exercise.description =
                        descriptionInput.value;

                    save();

                }

            );

            const setsContainer =

                card.querySelector(

                    ".sets-container"

                );

            exercise.sets.forEach(

                (

                    set,

                    setIndex

                ) => {

                    const row =

                        document.createElement(
                            "div"
                        );

                    row.className =
                        "set-row";

                    row.innerHTML = `

                        <span class="set-number">

                            ${setIndex + 1}

                        </span>

                        <input

                            class="set-input weight"

                            type="number"

                            step="0.5"

                            value="${set.weight}">

                        <input

                            class="set-input reps"

                            type="number"

                            value="${set.reps}">

                        <input

                            class="set-checkbox"

                            type="checkbox"

                            ${
                                set.done

                                    ?

                                "checked"

                                    :

                                ""

                            }>

                    `;

                    const weightInput =

                        row.querySelector(
                            ".weight"
                        );

                    const repsInput =

                        row.querySelector(
                            ".reps"
                        );

                    const checkbox =

                        row.querySelector(
                            ".set-checkbox"
                        );

                    weightInput.addEventListener(

                        "change",

                        () => {

                            set.weight =

                                Number(

                                    weightInput.value

                                )

                                ||

                                0;

                            save();

                        }

                    );

                    repsInput.addEventListener(

                        "change",

                        () => {

                            set.reps =

                                Number(

                                    repsInput.value

                                )

                                ||

                                0;

                            save();

                        }

                    );

                    checkbox.addEventListener(

                        "change",

                        () => {

                            set.done =
                                checkbox.checked;

                            registerHistory(
                                exercise
                            );

                            save();

                            render();

                        }

                    );

                    setsContainer.appendChild(
                        row
                    );

                }

            );

            card.querySelector(
                ".add-set"
            ).addEventListener(

                "click",

                () => {

                    const lastSet =

                        exercise.sets[

                            exercise.sets.length -
                            1

                        ];

                    exercise.sets.push({

                        weight:

                            lastSet

                                ?

                            lastSet.weight

                                :

                            0,

                        reps:

                            lastSet

                                ?

                            lastSet.reps

                                :

                            10,

                        done:
                            false

                    });

                    save();

                    render();

                }

            );

            card.querySelector(
                ".chart-button"
            ).addEventListener(

                "click",

                () => {

                    showChart(
                        exercise
                    );

                }

            );

            card.querySelector(
                ".rest-button"
            ).addEventListener(

                "click",

                openTimer

            );

            card.querySelector(
                ".delete-button"
            ).addEventListener(

                "click",

                () => {

                    if (

                        confirm(

                            "Excluir este exercício?"

                        )

                    ) {

                        exercises.splice(

                            exerciseIndex,

                            1

                        );

                        save();

                        render();

                    }

                }

            );

            setupDrag(

                card,

                exerciseIndex

            );

            exerciseList.appendChild(
                card
            );

        }

    );

}

/* =========================
   ARRASTAR EXERCÍCIOS
========================= */

let draggedIndex =
    null;

function setupDrag(

    card,

    index

) {

    const handle =

        card.querySelector(

            ".drag-handle"

        );

    handle.addEventListener(

        "pointerdown",

        event => {

            event.preventDefault();

            draggedIndex =
                index;

            card.classList.add(
                "dragging"
            );

            handle.setPointerCapture(

                event.pointerId

            );

        }

    );

    handle.addEventListener(

        "pointermove",

        event => {

            if (

                draggedIndex ===
                null

            ) {

                return;

            }

            const element =

                document.elementFromPoint(

                    event.clientX,

                    event.clientY

                );

            const target =

                element

                    ?

                element.closest(

                    ".exercise-card"

                )

                    :

                null;

            if (

                target

                &&

                target !== card

            ) {

                const targetIndex =

                    Number(

                        target.dataset.index

                    );

                const exercises =

                    db[

                        daySelect.value

                    ];

                const moved =

                    exercises.splice(

                        draggedIndex,

                        1

                    )[0];

                exercises.splice(

                    targetIndex,

                    0,

                    moved

                );

                save();

                draggedIndex =
                    targetIndex;

                render();

            }

        }

    );

    handle.addEventListener(

        "pointerup",

        () => {

            draggedIndex =
                null;

            card.classList.remove(
                "dragging"
            );

        }

    );

    handle.addEventListener(

        "pointercancel",

        () => {

            draggedIndex =
                null;

            card.classList.remove(
                "dragging"
            );

        }

    );

}

/* =========================
   ADICIONAR EXERCÍCIO
========================= */

document

    .getElementById(
        "addExercise"
    )

    .addEventListener(

        "click",

        () => {

            db[

                daySelect.value

            ].push(

                createExercise(

                    "Novo Exercício",

                    "Grupo muscular",

                    3,

                    0,

                    10

                )

            );

            save();

            render();

        }

    );

/* =========================
   TROCAR DIA
========================= */

daySelect.addEventListener(

    "change",

    render

);

/* =========================
   RESETAR DIA
========================= */

document

    .getElementById(
        "resetDay"
    )

    .addEventListener(

        "click",

        () => {

            if (

                confirm(

                    "Desmarcar todas as séries deste dia?"

                )

            ) {

                db[

                    daySelect.value

                ].forEach(

                    exercise => {

                        exercise.sets.forEach(

                            set => {

                                set.done =
                                    false;

                            }

                        );

                    }

                );

                save();

                render();

            }

        }

    );

/* =========================
   TIMER
========================= */

let timerSeconds =
    90;

let timerInterval =
    null;

function openTimer() {

    timerSeconds =
        90;

    updateTimer();

    document

        .getElementById(
            "timer"
        )

        .classList.add(
            "active"
        );

}

function updateTimer() {

    document

        .getElementById(
            "timerValue"
        )

        .textContent =

        timerSeconds;

}

document

    .getElementById(
        "startTimer"
    )

    .addEventListener(

        "click",

        () => {

            if (

                timerInterval

            ) {

                return;

            }

            timerInterval =

                setInterval(

                    () => {

                        timerSeconds--;

                        updateTimer();

                        if (

                            timerSeconds <=
                            0

                        ) {

                            clearInterval(

                                timerInterval

                            );

                            timerInterval =
                                null;

                            if (

                                navigator.vibrate

                            ) {

                                navigator.vibrate(

                                    [

                                        300,

                                        150,

                                        300

                                    ]

                                );

                            }

                        }

                    },

                    1000

                );

        }

    );

document

    .getElementById(
        "closeTimer"
    )

    .addEventListener(

        "click",

        () => {

            clearInterval(
                timerInterval
            );

            timerInterval =
                null;

            document

                .getElementById(
                    "timer"
                )

                .classList.remove(
                    "active"
                );

        }

    );

/* =========================
   MENU
========================= */

document

    .getElementById(
        "menuButton"
    )

    .addEventListener(

        "click",

        () => {

            document

                .getElementById(
                    "menuModal"
                )

                .classList.add(
                    "active"
                );

        }

    );

document

    .getElementById(
        "closeMenu"
    )

    .addEventListener(

        "click",

        () => {

            document

                .getElementById(
                    "menuModal"
                )

                .classList.remove(
                    "active"
                );

        }

    );

/* =========================
   EXPORTAR BACKUP
========================= */

document

    .getElementById(
        "exportButton"
    )

    .addEventListener(

        "click",

        () => {

            const backup = {

                treino:
                    db,

                historico:
                    history,

                data:

                    new Date()
                        .toISOString()

            };

            const blob =

                new Blob(

                    [

                        JSON.stringify(

                            backup,

                            null,

                            2

                        )

                    ],

                    {

                        type:
                            "application/json"

                    }

                );

            const url =

                URL.createObjectURL(
                    blob
                );

            const link =

                document.createElement(
                    "a"
                );

            link.href =
                url;

            link.download =

                "backup-meu-treino-v6.json";

            link.click();

            URL.revokeObjectURL(
                url
            );

        }

    );

/* =========================
   IMPORTAR BACKUP
========================= */

document

    .getElementById(
        "importButton"
    )

    .addEventListener(

        "click",

        () => {

            document

                .getElementById(
                    "fileInput"
                )

                .click();

        }

    );

document

    .getElementById(
        "fileInput"
    )

    .addEventListener(

        "change",

        event => {

            const file =
                event.target.files[0];

            if (
                !file
            ) {

                return;

            }

            const reader =
                new FileReader();

            reader.onload =

                event => {

                    try {

                        const backup =

                            JSON.parse(

                                event.target.result

                            );

                        if (

                            backup.treino

                        ) {

                            db =
                                backup.treino;

                        }

                        if (

                            backup.historico

                        ) {

                            history =
                                backup.historico;

                        }

                        save();

                        render();

                        alert(

                            "Backup importado com sucesso!"

                        );

                    }

                    catch {

                        alert(

                            "Backup inválido."

                        );

                    }

                };

            reader.readAsText(
                file
            );

        }

    );

/* =========================
   DIA AUTOMÁTICO
========================= */

function definirDiaDeHoje() {

    const mapa = {

        1:
            "Segunda-feira",

        2:
            "Terça-feira",

        3:
            "Quarta-feira",

        4:
            "Quinta-feira",

        5:
            "Sexta-feira"

    };

    const hoje =
        new Date().getDay();

    daySelect.value =

        mapa[hoje]

        ||

        "Segunda-feira";

}

/* =========================
   INICIALIZAÇÃO
========================= */

definirDiaDeHoje();

render();

window.addEventListener(

    "load",

    () => {

        setTimeout(

            () => {

                document

                    .getElementById(
                        "splashScreen"
                    )

                    .classList.add(
                        "hidden"
                    );

            },

            1800

        );

    }

);

/* =========================
   SERVICE WORKER
========================= */

if (

    "serviceWorker"

    in

    navigator

) {

    window.addEventListener(

        "load",

        () => {

            navigator.serviceWorker.register(

                "sw.js"

            );

        }

    );

}
